 back to him — legal shielding wins football matches.","Lose the ball? Win it back before it leaves your square."],easier:"Give the attacker a two-touch head start before the defender enters.",harder:"First to 3 wins, loser does the next duel against the winner; add a second ball to knock out.",view:"half-left",steps:[{label:"Attacker vs defender",cue:"Take him on your front foot.",cuePcm:"Use your leg, chop am, finish.",home:[g(11,"ATT",12,45)],away:[g(5,"DEF",22,45)],ball:[12,45],zones:[{x:8,y:28,w:24,h:36,label:"duel square"}],arrows:[{kind:"dribble",from:[12,45],to:[26,38]},{kind:"move",from:[22,45],to:[16,45],note:"defend"}]},{label:"Finish, then counter",cue:"Score, then win it back.",cuePcm:"Finish am, after turn press am.",home:[g(11,"ATT",30,38)],away:[g(5,"DEF",24,42)],ball:[30,38],equipment:[{type:"mini-goal",x:34,y:38,label:"goal"}],zones:[{x:8,y:28,w:24,h:36}],arrows:[{kind:"pass",from:[30,38],to:[36,36],note:"shot"}]}],tags:["no-cones","confidence","large-group","girls-ok"]},{id:"2v1-overlap",title:"2v1 with Overlap",titlePcm:"Two against one",band:"U12-U14",theme:"Possession",format:"7v7",minutes:15,players:"Threes plus a keeper or a target. 4 groups needs 12 players and 4 balls.",space:"Channel 10 steps long and 6 wide, goal or two stones at the end.",balls:"1 per group",makeshift:"Channel sides = a line of stones or a chalk line on concrete.",why:"Numbers up is the one pattern a young player must be able to smell. Two attackers, one defender, and a decision to make in 3 seconds.",objectives:["Commit the defender, then release","Timing of the run, not speed of the pass","Delay if you are not on"],coachingPoints:["First attacker walks the ball at the defender until he commits.","The second one runs wide behind him, never on his shoulder.","Pass to the far foot of the runner so the keeper cannot reach both."],easier:"Let the defender only shadow, no touching.",harder:"Make it 2v2 with a support player; limit attackers to 2 touches.",view:"half-left",st ,30],arrows:[{kind:"dribble",from:[58,30],to:[70,40]},{kind:"move",from:[58,70],to:[68,74],note:"width"},{kind:"pass",from:[62,50],to:[68,74]}]},{label:"Commit, then cut it back",cue:"One commits, one is free.",home:[g(8,"W",74,34),g(9,"ST",82,50),g(11,"W",72,72)],away:[g(4,"CB",80,40),g(5,"CB",76,60)],ball:[74,34],arrows:[{kind:"pass",from:[74,34],to:[84,50],note:"cut-back"},{kind:"move",from:[82,50],to:[88,50]}]}],tags:["transition","game-real","girls-ok"]},{id:"lose-press-5s",title:"Lose It, Press It (5 seconds)",titlePcm:"Lose am, press am before 5 count",band:"U15-U17",theme:"Pressing",format:"9v9",minutes:15,players:"8 (4v4) plus 2 jokers to make 4v2 for the press.",space:"Half pitch, 4 mini-goals on the end lines.",balls:"1-2",makeshift:"Count the 5 seconds out loud. The sound is the coaching.",why:'Counter-pressing is the cheapest team tactic there is and it fixes "we lose the ball and just watch". Everyone sprints, then everyone resets.',objectives:["Nearest player goes, second player covers the pass","No standing, no complaining","Win it or foul it in a smart place"],coachingPoints:["The moment you lose the ball, 3 things happen: swarm the ball, cut the forward pass, drop the goal-side line.","Shout the trigger word so the whole group starts together.","If you cannot win it in 5 seconds, sprint back and get your shape."],easier:"Give the pressing team a head start of one player.",harder:"Playing out from the back under press, with points for a goal within 8 passes.",view:"half-left",steps:[{label:"Ball lost — swarm",cue:"Nearest goes, next covers the lane.",cuePcm:"Nearest man dey go, second man dey block pass.",home:[g(6,"LOSE",22,46),g(8,"SUP",16,34),g(4,"SUP",26,62),g(2,"BAL",30,40)],away:[g(9,"WIN",24,50),g(11,"CUT",18,60),g(7,"DRP",34,52)],ball:[22,46],arrows:[{kind:"move",from:[24,50],to:[22,46],note:"1st: ball"},{kind:"move",from:[18,60],to:[20,52],note:"2nd: lane"},{kind:"move",from:[34,52],to:[30,46],note:"3rd: goal side"}]}],tags:["team-tactic","fitness","voice"]},{id:"build-out-3v2",title:"Build Out From the Back (3v2)",band:"Adult",theme:"Possession",format:"11v11",minutes:18,players:"6: GK, 2 centre backs, a midfielder; 2 forwards.",space:"Penalty-box width, from goal line to halfway arc. Add a target zone 8 steps wide beyond.",balls:"2 (service from the coach keeps it moving)",makeshift:"If you have no cones for the target zone, use two water sachets and an agreed line.",why:"Every team wants to play out; most get pressed into panic. This isolates exactly the overload that beats two forwards.",objectives:["Keeper as the +1","Create the third-man pass","Bait, then break the line"],coachingPoints:["Centre backs split wide to the penalty-box edge; the midfielder drops between or steps beside.","First touch must be directional, into the open body shape, not safety-side.","If the midfielder is shut, we go goalkeeper → full-back → target. Never force the middle."],easier:"Remove one forward; allow 3 touches.",harder:"A fourth presser enters on the coach's call; or score only by a line-breaking pass to the target.",view:"half-left",steps:[{label:"Bait the press",cue:"Show them the ball, then go around.",home:[g(1,"GK",4,50,!0),g(4,"RCB",14,62),g(5,"LCB",14,38),g(6,"DM",24,50)],away:[g(9,"FWD",20,42),g(10,"FWD",22,58)],ball:[4,50],zones:[{x:2,y:28,w:26,h:44,label:"build zone"}],arrows:[{kind:"pass",from:[4,50],to:[14,62]},{kind:"pass",from:[14,62],to:[24,50]},{kind:"move",from:[24,50],to:[30,40],note:"third man"}]},{label:"Break the line",cue:"Into the target, then hold it.",home:[g(1,"GK",4,50,!0),g(4,"RCB",16,60),g(5,"LCB",16,40),g(6,"DM",28,52)],away:[g(9,"FWD",22,44),g(10,"FWD",24,60)],ball:[34,34],zones:[{x:2,y:28,w:26,h:44},{x:30,y:24,w:8,h:24,label:"target"}],arrows:[{kind:"pass",from:[28,52],to:[34,34],note:"line-break"},{kind:"move",from:[16,60],to:[26,66]}]}],tags:["shape","keeper","semi-pro"]},{id:"press-trap-side",title:"Press Trap — Send Wide, Then Shut",band:"Adult",theme:"Pressing",format:"11v11"
