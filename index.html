<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tactical Coach — Coach Kit (offline football coaching board)</title>
    <meta
      name="description"
      content="Free offline football coaching workspace: build, animate and present tactics, share drill cards on WhatsApp. No account, nothing uploaded."
    />
    <!--
      No web fonts on purpose. This app has to open instantly on a phone at a training
      ground with no signal, and it is also distributed as a single HTML file over WhatsApp.
      Any external request is a way for it to fail.
    -->
    <meta name="theme-color" content="#0b1220" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Coach Kit" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-white overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
